name: Build BeatsByBony (Windows)

on:
  push:
  workflow_dispatch:      # lets you press "Run workflow" by hand

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up the build
        run: cmake -S . -B build -A x64

      - name: Build the Note Grabber plugin and the Stem Splitter program
        run: cmake --build build --config Release --target BeatsByBony_VST3 BeatsByBonySplitter --parallel

      - name: Collect the finished files
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "BeatsByBony.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "The build did not produce BeatsByBony.vst3" }
          New-Item -ItemType Directory -Force -Path dist/NoteGrabber | Out-Null
          Copy-Item -Recurse -Force $vst3.FullName dist/NoteGrabber/BeatsByBony.vst3
          Copy-Item installer/Install-NoteGrabber.bat dist/NoteGrabber/
          Copy-Item README.md dist/NoteGrabber/

          $exe = Get-ChildItem -Path build -Recurse -Filter "BeatsByBony Stem Splitter.exe" | Select-Object -First 1
          if (-not $exe) { throw "The build did not produce the Stem Splitter .exe" }
          New-Item -ItemType Directory -Force -Path "dist/StemSplitter" | Out-Null
          Copy-Item $exe.FullName "dist/StemSplitter/BeatsByBony Stem Splitter.exe"
          $dll = Join-Path $exe.DirectoryName "onnxruntime.dll"
          if (-not (Test-Path $dll)) { throw "onnxruntime.dll was not copied next to the .exe" }
          Copy-Item $dll dist/StemSplitter/
          Copy-Item README.md dist/StemSplitter/
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Upload the Note Grabber plugin
        uses: actions/upload-artifact@v4
        with:
          name: BeatsByBony-NoteGrabber-VST3
          path: dist/NoteGrabber

      - name: Upload the Stem Splitter program
        uses: actions/upload-artifact@v4
        with:
          name: BeatsByBony-StemSplitter-Windows
          path: dist/StemSplitter

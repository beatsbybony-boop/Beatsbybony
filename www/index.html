<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<title>Cool Edit Mobile</title>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#008080}
/* Layout: a Windows 98 style editor window on a teal desktop. Title bar, menu bar, toolbar, black waveform view with ruler, scrollbar, transport with LCD time, status bar. Single look by design. */
:root{
  --desk:#008080; --face:#c0c0c0; --hi:#ffffff; --lo:#808080; --dk:#000000; --soft:#dfdfdf;
  --navy:#000080; --navy2:#1084d0; --ink:#000000; --ink-dim:#404040;
  --wave:#33ff33; --wavebg:#000000; --grid:#0b4a0b; --sel:#e8e8e8; --lcd:#33ff33; --cursor:#ffff00;
  --font:Tahoma,"MS Sans Serif",Verdana,Geneva,sans-serif; --mono:"Courier New",Courier,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:13px/1.25 var(--font);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-user-select:none;user-select:none}
#win{height:100%;display:flex;flex-direction:column;background:var(--face);max-width:1100px;margin:0 auto;
  border:2px solid;border-color:var(--soft) var(--dk) var(--dk) var(--soft);box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--hi);padding:2px;gap:3px;min-height:0}
#title{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;font-weight:700;padding:3px 6px;display:flex;align-items:center;gap:6px;min-width:0}
#title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.raised{border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--soft)}
.sunken{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px var(--dk)}
button{font:inherit;color:var(--ink);background:var(--face);cursor:pointer;min-height:34px;padding:0 9px;margin:0;
  border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--soft);touch-action:manipulation}
button:active,button.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--lo);padding:1px 8px 0 10px}
button:disabled{color:var(--lo);text-shadow:1px 1px var(--hi);cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px dotted var(--dk);outline-offset:-5px}
#menubar{display:flex;overflow-x:auto;scrollbar-width:none;flex:none}
#menubar button{border-color:transparent;box-shadow:none;background:transparent;min-height:32px;padding:0 10px}
#menubar button.open{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
#toolbar,#zoombar{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:none;padding:2px 0}
#toolbar button,#zoombar button{flex:none;min-width:44px}
.sep{flex:none;width:2px;margin:2px 3px;border-left:1px solid var(--lo);border-right:1px solid var(--hi)}
#view{flex:1;min-height:150px;position:relative;background:var(--wavebg);min-width:0}
#wave,#ruler{display:block;width:100%;touch-action:none}
#wave{height:100%}
#ruler{height:24px;flex:none;touch-action:none}
#rulerwrap{flex:none}
#scroll{width:100%;height:22px;margin:0;flex:none;accent-color:var(--face)}
#transport{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:none}
#lcd{font:700 22px/1 var(--mono);color:var(--lcd);background:#000;padding:6px 8px;min-width:128px;text-align:right;letter-spacing:1px;flex:none}
#tbtns{display:flex;gap:2px;flex:none}
#tbtns button{width:42px;padding:0;display:grid;place-items:center}
#tbtns button:active,#tbtns button.on{padding:1px 0 0 1px}
#tbtns svg{width:18px;height:18px;fill:var(--ink);display:block;pointer-events:none}
#tbtns button:disabled svg{fill:var(--lo)}
#tbtns button.rec svg{fill:#d00000}
#tbtns button.recording{background:#e8b0b0}
@media (prefers-reduced-motion:no-preference){#tbtns button.recording svg{animation:blink 1s steps(2,start) infinite}}
@keyframes blink{50%{opacity:.25}}
#meter{width:min(130px,32vw);height:20px;background:#000;flex:none}
#status{display:flex;gap:3px;flex:none;font-size:12px}
#status>div{padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#sinfo{flex:2 1 0}#sfmt{flex:1 1 0}#smsg{flex:2 1 0}
@media (max-width:640px){#status{flex-wrap:wrap}#sinfo{flex:1 1 100%}#sfmt{flex:1 1 40%}#smsg{flex:1 1 55%}}
#menu{position:fixed;z-index:50;background:var(--face);min-width:210px;max-height:70vh;overflow-y:auto;padding:2px}
#menu button{display:block;width:100%;text-align:left;border-color:transparent;box-shadow:none;background:transparent;min-height:34px;padding:0 24px 0 22px}
#menu button:active,#menu button:hover{background:var(--navy);color:#fff;padding:0 24px 0 22px}
#menu button.chk::before{content:"\2713";position:absolute;margin-left:-16px}
#menu button:disabled:hover{background:transparent;color:var(--lo)}
#menu hr{border:0;border-top:1px solid var(--lo);border-bottom:1px solid var(--hi);margin:3px 2px}
#menu .k{float:right;color:inherit;opacity:.7;margin-left:18px}
#backdrop{position:fixed;inset:0;z-index:40;background:transparent}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:var(--face);width:min(400px,100%);max-height:92%;display:flex;flex-direction:column;padding:2px}
.box h2{margin:0;font-size:13px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:4px 6px}
.body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;-webkit-user-select:text;user-select:text}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.row label{min-width:0}
.row .ctl{display:flex;gap:5px;align-items:center}
.row input[type=number],.row input[type=text],.row select{font:inherit;min-height:32px;padding:2px 4px;width:120px;background:#fff;color:var(--ink);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px var(--dk)}
.row input[type=checkbox]{width:20px;height:20px}
.unit{min-width:26px;color:var(--ink-dim)}
.note{color:var(--ink-dim);font-size:12px;line-height:1.35}
.btns{display:flex;gap:8px;justify-content:flex-end;padding:0 10px 10px}
.btns button{min-width:84px}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.st td,table.st th{padding:3px 6px;border-bottom:1px solid var(--lo);text-align:right}
table.st th:first-child,table.st td:first-child{text-align:left}
#spec{display:block;background:#000;width:100%;height:170px;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="win">
  <div id="title" class="raised" style="border:0;box-shadow:none"><span id="ttl">Cool Edit Mobile</span></div>
  <div id="menubar" role="menubar"></div>
  <div id="toolbar"></div>
  <div id="view" class="sunken"><canvas id="wave"></canvas></div>
  <div id="rulerwrap" class="sunken"><canvas id="ruler"></canvas></div>
  <input type="range" id="scroll" min="0" max="1000" value="0" step="1" aria-label="Scroll waveform">
  <div id="transport">
    <div id="lcd" class="sunken" aria-live="off">0:00.000</div>
    <div id="tbtns"></div>
    <canvas id="meter" class="sunken" width="130" height="20"></canvas>
  </div>
  <div id="zoombar"></div>
  <div id="status">
    <div id="sinfo" class="sunken"></div><div id="sfmt" class="sunken"></div><div id="smsg" class="sunken"></div>
  </div>
</div>
<div id="backdrop" hidden></div>
<div id="menu" class="raised" hidden role="menu"></div>
<div id="modal" hidden></div>
<input type="file" id="file" accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a,.aac" hidden>

<script>
/*DSP_START*/
var DSP=(function(){

  function coef(type,f,q,gdb,sr){

    else if(type==='bp'){b0=al;b1=0;b2=-al;a0=1+al;a1=-2*cs;a2=1-al}

  function runBiquad(x,s,e,co){var x1=0,x2=0,y1=0,y2=0;for(var i=s;i<e;i++){var xi=x[i],y=co[0]*xi+co[1]*x1+co[2]*x2-co[3]*y1-co[4]*y2;x2=x1;x1=xi;y2=y1;y1=y;x[i]=y}}

  function speed(chs,s,e,ratio){
    var n=e-s,m=Math.max(1,Math.round(n/ratio));

  }
  function mono(chs){var n=chs[0].length,o=new Float32Array(n);for(var c=0;c<chs.length;c++)for(var i=0;i<n;i++)o[i]+=chs[c][i]/chs.length;return [o]}
  function tone(sr,freq,dur,ampDb,shape){
    var n=Math.max(1,Math.round(sr*dur)),o=new Float32Array(n),a=g(ampDb),ph=0,inc=freq/sr;

  function noise(sr,dur,ampDb,kind,seed){

  }
  function stats(chs,s,e){

  function spectrum(chs,s,e,N){

  var crcT=null;

  function zip(name,data,date){

  try{wave.setPointerCapture(ev.pointerId)}catch(e){}
  ptrs[ev.pointerId]=ev;var ids=Object.keys(ptrs);
  if(ids.length===2){drag=null;var p=ptrs[ids[0]],q=ptrs[ids[1]],mx=(p.clientX+q.clientX)/2-wave.getBoundingClientRect().left;pinch={d:Math.abs(p.clientX-q.clientX)||1,spp:S.spp,anchor:S.vs+(mx-GUT)*S.spp,ids:ids};return}
  if(ids.length>2)return;
  var x=Math.max(GUT,localX(ev)),s=smp(x),anchor=s;
  if(hasSel()){
    var xa=sx(S.a),xb=sx(S.b);
    if(Math.abs(x-xa)<14&&Math.abs(x-xa)<=Math.abs(x-xb))anchor=S.b;
    else if(Math.abs(x-xb)<14)anchor=S.a;
    else if(ev.shiftKey)anchor=s<S.a?S.b:S.a;
    else{S.a=S.b=s}
  }else if(ev.shiftKey&&S.a!==s){anchor=S.a}else{S.a=S.b=s}
  drag={anchor:anchor};
  if(anchor!==s){S.a=Math.min(anchor,s);S.b=Math.max(anchor,s)}
  draw();
}
function onMove(ev){
  if(!ptrs[ev.pointerId])return;ptrs[ev.pointerId]=ev;
  if(pinch){
    var p=ptrs[pinch.ids[0]],q=ptrs[pinch.ids[1]];if(!p||!q)return;
    var d=Math.abs(p.clientX-q.clientX)||1,mx=(p.clientX+q.clientX)/2-wave.getBoundingClientRect().left;
    S.spp=Math.min(Math.max(pinch.spp*pinch.d/d,0.02),maxSpp());S.vs=pinch.anchor-(mx-GUT)*S.spp;clampView();draw();return;
  }
  if(!drag)return;
  var x=localX(ev);
  if(x<GUT+14)S.vs-=S.spp*14;else if(x>CW-14)S.vs+=S.spp*14;clampView();
  var s=smp(Math.max(GUT,Math.min(CW,x)));S.a=Math.min(drag.anchor,s);S.b=Math.max(drag.anchor,s);draw();
}
function onUp(ev){
  delete ptrs[ev.pointerId];
  if(Object.keys(ptrs).length<2)pinch=null;
  if(!Object.keys(ptrs).length)drag=null;
  if(S.b-S.a>0&&S.b-S.a<Math.max(1,S.spp*3)){S.b=S.a;draw()}
}
wave.addEventListener('pointerdown',onDown);wave.addEventListener('pointermove',onMove);wave.addEventListener('pointerup',onUp);wave.addEventListener('pointercancel',onUp);
wave.addEventListener('wheel',function(ev){
  if(!len())return;ev.preventDefault();
  if(ev.ctrlKey||ev.metaKey){var x=localX(ev);zoomAt(ev.deltaY>0?1.2:1/1.2,S.vs+(x-GUT)*S.spp,x-GUT)}
  else{S.vs+=(ev.deltaX||ev.deltaY)*S.spp;clampView();draw()}
},{passive:false});
scroll.addEventListener('input',function(){var span=len()-viewW()*S.spp;if(span>0){S.vs=scroll.value/1000*span;clampView();draw()}});
$('file').addEventListener('change',function(ev){var f=ev.target.files[0];ev.target.value='';openFile(f)});
document.addEventListener('keydown',function(ev){
  if(!$('modal').hidden){return}
  var t=ev.target.tagName;if(t==='INPUT'||t==='SELECT')return;
  var mod=ev.ctrlKey||ev.metaKey,k=ev.key.toLowerCase();
  if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?doRedo():doUndo()}
  else if(mod&&k==='y'){ev.preventDefault();doRedo()}
  else if(mod&&k==='x'){ev.preventDefault();E.cut()}
  else if(mod&&k==='c'){ev.preventDefault();E.copy()}
  else if(mod&&k==='v'){ev.preventDefault();E.paste()}
  else if(mod&&k==='a'){ev.preventDefault();E.all()}
  else if(k==='delete'||k==='backspace'){if(hasSel()){ev.preventDefault();E.del()}}
  else if(k===' '&&t!=='BUTTON'){ev.preventDefault();S.play?stop():play()}
  else if(k==='escape')closeMenu();
});


/* ---------- recording ---------- */
function resample(x,from,to){
  if(from===to)return x;var n=Math.max(1,Math.round(x.length*to/from)),o=new Float32Array(n),r=from/to;
  for(var i=0;i<n;i++){var p=i*r,j=Math.min(x.length-1,Math.floor(p)),f=p-j,a=x[j],b=x[Math.min(x.length-1,j+1)];o[i]=a+(b-a)*f}
  return o;
}
function insertRecording(chs,sr,name){
  if(!chs.length||!chs[0].length){say('Nothing was recorded.');return}
  var rec,n;
  if(!len()){
    stopPlay();var ar=chs.map(function(x){return x.slice()});
    S.sr=sr;S.name=name;commit(ar,0,ar[0].length);fitAll();draw();say('Recorded '+fmt(ar[0].length)+'.');return;
  }
  var s=S.a,e=hasSel()?S.b:S.a,ins=S.ch.map(function(_,c){
    var src=chs.length>1&&S.ch.length===1?DSP.mono(chs)[0]:chs[Math.min(c,chs.length-1)];return resample(src,sr,S.sr)});
  stopPlay();commit(splice(s,e,ins),s,s+ins[0].length);say('Recorded '+fmt(ins[0].length)+' at the cursor.');
}
function recUi(on){
  $('bRec').classList.toggle('recording',on&&S.rec&&S.rec.kind==='mix');$('bMic').classList.toggle('recording',on&&S.rec&&S.rec.kind==='mic');
  clearInterval(recUi.t);
  if(on){recUi.t=setInterval(function(){if(!S.rec)return;$('lcd').textContent=fmt((performance.now()-S.rec.t0)/1000*S.sr);drawMeter()},100)}
  else{$('bRec').classList.remove('recording');$('bMic').classList.remove('recording');drawMeter();updStatus()}
}
function recMic(){
  if(S.rec){if(S.rec.kind==='mic')stopMic();else say('Stop the monitor mix recording first.');return}
  var md=navigator.mediaDevices;
  if(!md||!md.getUserMedia){say('Microphone recording is not available here.');return}
  if(S.play)stop();
  ensureCtx();if(!S.ac)return;
  say('Asking for microphone access...');
  md.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
    var ac=S.ac,src=ac.createMediaStreamSource(stream),sp=ac.createScriptProcessor(4096,1,1),mute=ac.createGain(),chunks=[];
    mute.gain.value=0;
    var r={kind:'mic',t0:performance.now(),chunks:chunks,stream:stream,src:src,sp:sp,mute:mute,sr:ac.sampleRate,lvl:0};
    sp.onaudioprocess=function(ev){var d=ev.inputBuffer.getChannelData(0),c=new Float32Array(d),p=0;for(var i=0;i<c.length;i++){var v=c[i]<0?-c[i]:c[i];if(v>p)p=v}chunks.push(c);if(p>r.lvl)r.lvl=p};
    src.connect(sp);sp.connect(mute);mute.connect(ac.destination);
    S.rec=r;recUi(true);say('Recording from the microphone. Tap Mic again to stop.');
  }).catch(function(err){say('Could not use the microphone: '+((err&&(err.name||err.message))||'blocked'))});
}
function stopMic(){
  var r=S.rec;if(!r)return;S.rec=null;
  try{r.sp.onaudioprocess=null;r.src.disconnect();r.sp.disconnect();r.mute.disconnect()}catch(e){}
  r.stream.getTracks().forEach(function(t){t.stop()});recUi(false);
  var n=0;r.chunks.forEach(function(c){n+=c.length});var o=new Float32Array(n),p=0;r.chunks.forEach(function(c){o.set(c,p);p+=c.length});
  insertRecording([o],r.sr,'Recording.wav');
}
function recMix(){
  if(S.rec){if(S.rec.kind==='mix')stopMix();else say('Stop the microphone recording first.');return}
  var P=isNative()?plug('MixCapture'):null;
  if(!P){say('Recording audio from other apps only works in the Android app.');return}
  if(S.play)stop();
  say('Android will ask to start capturing. Tap Start now.');
  P.start().then(function(){S.rec={kind:'mix',t0:performance.now(),lvl:0};recUi(true);say('Recording other apps. Play your music now. Tap Rec again to stop.')})
   .catch(function(err){say('Could not start: '+((err&&err.message)||'declined'))});
}
function stopMix(){
  var r=S.rec;if(!r)return;S.rec=null;recUi(false);
  var P=plug('MixCapture'),FS=plug('Filesystem');
  P.stop().then(function(res){
    return FS.readFile({path:res.uri}).then(function(f){
      var u=unb64(f.data),sh=new Int16Array(u.buffer,u.byteOffset,Math.floor(u.length/2)),nc=res.channels||2,n=Math.floor(sh.length/nc),chs=[];
      for(var c=0;c<nc;c++){var x=new Float32Array(n);for(var i=0;i<n;i++)x[i]=sh[i*nc+c]/32768;chs.push(x)}
      FS.deleteFile({path:res.uri}).catch(function(){});
      var pk=0;chs.forEach(function(x){for(var i=0;i<x.length;i+=7){var v=x[i]<0?-x[i]:x[i];if(v>pk)pk=v}});
      insertRecording(chs,res.sampleRate||44100,'Monitor mix.wav');
      if(pk<0.0005)say('The recording is silent. Some apps block audio capture, or nothing was playing.');
    });
  }).catch(function(err){say('Recording failed: '+((err&&err.message)||'unknown'))});
}

function loadDemo(announce){
  stopPlay();S.sr=44100;S.ch=DSP.demo(44100);S.name='Demo beat.wav';S.a=S.b=0;S.undo=[];S.redo=[];S.resume=null;S.ver++;fitAll();draw();
  if(announce)say('Loaded a demo beat. Drag on the waveform to select, then try Transform.');
}
buildMenus();buildBars();setPlayBtns();
if(window.ResizeObserver)new ResizeObserver(function(){resize()}).observe($('view'));else window.addEventListener('resize',resize);
loadDemo(false);resize();fitAll();draw();drawMeter();
})();
</script>

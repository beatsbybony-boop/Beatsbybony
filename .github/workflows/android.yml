name: Build Android APK

on:
  push:
    branches: [cool-edit-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Add native recorder and permissions
        run: python3 native/patch_android.py
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoolEditMobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cool-edit-mobile-${{ github.run_number }}
          name: Cool Edit Mobile build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
